<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión Hospitalaria</title>

    <link href="https://bootswatch.com/5/minty/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="/css/custom.css">

    <style>
        #app-container { display: none; }
        #login-container { max-width: 400px; margin: 100px auto; }
    </style>
</head>
<body>

<div id="login-container" class="container">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h3 class="card-title text-center mb-4"><i class="bi bi-hospital"></i> Iniciar Sesión</h3>
            <form id="login-form">
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="username" placeholder="usuario" required>
                    <label for="username">Nombre de Usuario</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="password" placeholder="contraseña" required>
                    <label for="password">Contraseña</label>
                </div>
                <div class="d-grid">
                    <button class="btn btn-primary btn-lg" type="submit">Ingresar</button>
                </div>
            </form>
            <div id="login-error" class="alert alert-danger mt-3 d-none"></div>
        </div>
    </div>
</div>

<div id="app-container" class="d-flex">

    <nav id="sidebar" class="d-flex flex-column p-3">
        <a class="navbar-brand d-flex align-items-center mb-3" href="#">
            <i class="bi bi-hospital fs-2 me-2"></i>
            <span class="fs-4">Gestión Hosp.</span>
        </a>
        <hr>
        <ul class="nav nav-pills flex-column mb-auto">
            <li class="nav-item">
                <a href="#" class="nav-link active" id="nav-inicio"><i class="bi bi-house-door-fill"></i> Inicio</a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link" id="nav-pacientes"><i class="bi bi-people-fill"></i> Pacientes</a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link" id="nav-medicos"><i class="bi bi-file-earmark-medical-fill"></i> Médicos</a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link" id="nav-citas"><i class="bi bi-calendar-plus-fill"></i> Citas</a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link" id="nav-hospitalizacion"><i class="bi bi-building-fill-add"></i> Hospitalización</a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link" id="nav-facturas"><i class="bi bi-file-earmark-text-fill"></i> Facturas</a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link" id="nav-usuarios"><i class="bi bi-person-fill-gear"></i> Usuarios</a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link" id="nav-bitacora"><i class="bi bi-journal-text"></i> Bitácora</a>
            </li>
        </ul>
        <hr>
        <button class="btn btn-light" id="btn-logout"><i class="bi bi-box-arrow-right me-2"></i> Cerrar Sesión</button>
    </nav>
    <div id="content-wrapper" class="flex-grow-1 d-flex flex-column">

        <main class="container-fluid p-4">
            <div id="main-content">
            </div>
        </main>

        <footer class="footer mt-auto py-3">
            <div class="container text-center">
                <span class="text-muted">Desarrollado por Ailyn Medina &copy; 2025</span>
            </div>
        </footer>
    </div>
</div>
<div class="modal fade" id="formModal" tabindex="-1">
    <div class="modal-dialog modal-lg"><div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="modalTitle"></h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body" id="modalBody"></div>
    </div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
