<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión Hospitalaria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        #app-container { display: none; } /* Oculta la app principal por defecto */
        #login-container { max-width: 400px; margin: 100px auto; } /* Centra el login */
    </style>
</head>
<body>

<div id="login-container" class="container">
    <div class="card">
        <div class="card-body p-4">
            <h3 class="card-title text-center mb-4"><i class="bi bi-hospital"></i> Iniciar Sesión</h3>
            <form id="login-form">
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="username" placeholder="usuario" required>
                    <label for="username">Nombre de Usuario</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="password" placeholder="contraseña" required>
                    <label for="password">Contraseña</label>
                </div>
                <div class="d-grid">
                    <button class="btn btn-primary btn-lg" type="submit">Ingresar</button>
                </div>
            </form>
            <div id="login-error" class="alert alert-danger mt-3 d-none"></div>
        </div>
    </div>
</div>

<div id="app-container">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><i class="bi bi-hospital"></i> Gestión Hospitalaria</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link active" href="#" id="nav-pacientes">Pacientes</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" id="nav-medicos">Médicos</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" id="nav-citas">Citas</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" id="nav-hospitalizacion">Hospitalización</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" id="nav-facturas">Facturas</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" id="nav-usuarios">Usuarios</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" id="nav-bitacora">Bitácora</a></li>
                </ul>
                <button class="btn btn-outline-light" id="btn-logout">Cerrar Sesión</button>
            </div>
        </div>
    </nav>

    <main class="container mt-4">
        <div id="main-content"></div>
    </main>

    <div class="modal fade" id="formModal" tabindex="-1">
        <div class="modal-dialog modal-lg"><div class="modal-content">
            <div class="modal-header"><h5 class="modal-title" id="modalTitle"></h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body" id="modalBody"></div>
        </div></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
